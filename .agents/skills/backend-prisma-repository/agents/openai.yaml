interface:
  display_name: "Backend Prisma Repository"
  short_description: "Implement a Prisma repository in the backend from an interface"
  default_prompt: "Use $backend-prisma-repository to take an explicit domain repository interface, infer the module from the path, create the *.prisma.ts file at the backend module root by default, register DbModule and PrismaService in the Nest module, and inject the concrete Prisma class in the backend without requiring a symbol by default."
